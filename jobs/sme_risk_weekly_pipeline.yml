resources:
  jobs:
    sme_risk_weekly_pipeline:
      name: sme_risk_weekly_pipeline
      email_notifications:
        on_failure:
          - domamanaswini@gmail.com
      schedule:
        quartz_cron_expression: 0 0 7 ? * Wed
        timezone_id: Australia/Sydney
        pause_status: UNPAUSED
      tasks:
        - task_key: bronze_layer
          notebook_task:
            notebook_path: /Workspace/Users/domamanaswini@gmail.com/sme-lending-risk-analytics/notebooks/bronze_ingest
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 900000
          disable_auto_optimization: false
        - task_key: silver_layer
          depends_on:
            - task_key: bronze_layer
          notebook_task:
            notebook_path: /Workspace/Users/domamanaswini@gmail.com/sme-lending-risk-analytics/notebooks/silver_transform
            source: WORKSPACE
        - task_key: gold_layer
          depends_on:
            - task_key: silver_layer
          notebook_task:
            notebook_path: /Workspace/Users/domamanaswini@gmail.com/sme-lending-risk-analytics/notebooks/gold_build
            source: WORKSPACE
      tags:
        project: sme-lending-risk
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
